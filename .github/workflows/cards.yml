# Regenerates the profile cards and commits them, so the README serves its
# images from this repo instead of a third-party renderer that can rate-limit
# or go offline.
name: Refresh profile cards

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate_cards.py"
      - ".github/workflows/cards.yml"
  workflow_dispatch:

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python .github/scripts/generate_cards.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "cards unchanged"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
