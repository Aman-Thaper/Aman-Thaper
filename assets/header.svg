<text class="r" x="45" y="101" fill="#e9d5ff">FULL-STACK &#183; SECURITY TOOLING &#183; AI</text>
<text class="c" x="42" y="141" fill="#ffffff">Attack. Prove. Fix. Retest.<tspan fill="#ffffff">&#9608;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

</g></svg>