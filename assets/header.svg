<radialGradient id="glow" cx="50%" cy="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<clipPath id="frame"><rect width="880" height="190" rx="14"/></clipPath>
</defs>
<style>.n{font:700 46px 'Segoe UI',Ubuntu,Helvetica,Sans-Serif}.r{font:400 15px 'Segoe UI',Ubuntu,Helvetica,Sans-Serif;letter-spacing:2.4px}.c{font:400 17px 'JetBrains Mono',Consolas,'Courier New',monospace}</style>
<g clip-path="url(#frame)">
<rect width="880" height="190" fill="url(#g)"/>
